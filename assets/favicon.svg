<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer subtle glowing border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Code brackets & Initial 'A' -->
  <g filter="url(#glow)">
    <!-- Left bracket < -->
    <path d="M18 24 L11 32 L18 40" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right bracket > -->
    <path d="M46 24 L53 32 L46 40" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central letter 'A' -->
    <path d="M26 41 L32 23 L38 41" fill="none" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28.5 35 L35.5 35" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Status dot -->
  <circle cx="48" cy="16" r="3.5" fill="#10b981" />
</svg>
